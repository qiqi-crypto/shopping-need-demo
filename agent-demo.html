<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一轮真实试跑 · 生活选物</title><link rel="stylesheet" href="agent.css"><style>main{grid-template-columns:240px minmax(0,1fr)}.steps{padding:14px;max-height:80vh;overflow:auto}.steps button{display:block;width:100%;text-align:left;margin:6px 0}.steps button.active{background:#fff0e5;border-color:#eb601e;color:#a74216}.details{padding:18px;white-space:pre-wrap;line-height:1.8}.demo-note{max-width:1450px;margin:22px auto 0;padding:0 28px;color:#777;line-height:1.8}#frame{width:100%;display:block}.feedback{background:#fff3e8;padding:12px 18px;white-space:pre-wrap;line-height:1.8}pre{white-space:pre-wrap;font-size:12px}@media(max-width:800px){main{grid-template-columns:1fr}.steps{max-height:200px}}</style></head><body><header><a class="brand" href="catalog.html">生活选物 <span>真实试跑回放</span></a><a href="agent.html">自己试试 Agent →</a></header><div class="demo-note"><strong>这是一次实际运行的记录回放，不是实时运行。</strong><br><span id="note"></span>点击左侧步骤，看它实际做了什么、页面怎样变化。每张图都是当时的浏览器截图。</div><main><nav class="browser-pane steps" id="steps"></nav><section class="browser-pane"><div class="pane-title"><b id="title"></b><span id="version"></span></div><div id="feedback" class="feedback"></div><img id="frame" alt="该步骤执行后的实际浏览器截图"><div class="details"><b>这一刻看到了什么变化</b><div id="changes"></div><details><summary>实际工具调用与结果</summary><pre id="raw"></pre></details></div></section></main><section style="max-width:1400px;margin:20px auto;padding:20px;background:white;border-radius:12px"><h2>本轮对话与最终答复</h2><div id="conversation"></div><p>这里的推荐没有产生购买。反馈前后的差异是观测记录，不自动证明因果关系，也不代表来源识别模型已被验证。</p><a href="demo-run.json" download>下载这一轮的精简记录</a></section><script>
fetch('demo-run.json').then(r=>r.json()).then(d=>{const $=id=>document.getElementById(id),names={input:'尝试输入',click:'点击页面',go_back:'返回',scroll:'滚动查看',wait:'等待',done:'给出建议',ask_user:'询问用户',send_keys:'键盘操作'};$('note').textContent=d.label;d.steps.forEach((s,i)=>{const b=document.createElement('button');const action=Object.keys(s.actions?.[0]||{})[0];b.textContent='第 '+s.step+' 步 · '+(names[action]||action||'执行未完成');b.onclick=()=>show(i);$('steps').append(b);});function show(i){const s=d.steps[i];[...$('steps').children].forEach((b,j)=>b.classList.toggle('active',j===i));$('title').textContent='第 '+s.step+' 步';$('version').textContent='需求版本 '+s.feedback_version;const f=d.dialogue.filter(x=>x.type==='feedback_applied'&&x.feedback_version<=s.feedback_version).at(-1);$('feedback').textContent=(s.feedback_version===1?'初始需求：':'最新补充（保留此前未修改的要求）：')+(f?.text||'');$('frame').src=s.image||'';const lines=[],c=s.changes,name=id=>d.item_names?.[id]||id; if(c.query)lines.push('搜索词：'+(c.query.before||'未搜索')+' → '+c.query.after);if(c.current_item)lines.push(c.current_item.after?'打开商品：'+name(c.current_item.after):'返回商品列表');if(c.available_item_ids)lines.push('列表更新：当前 '+c.available_item_ids.after.length+' 件商品');if(c.compared)lines.push('比较栏：'+(c.compared.after.length?c.compared.after.map(name).join('；'):'已清空'));if(c.viewport_item_ids)lines.push('当前视口内的商品发生变化。');$('changes').textContent=lines.join('\n')||'本步未改变搜索词、详情商品或候选集合。输入尝试不等于搜索成功，具体结果见下方。';$('raw').textContent=JSON.stringify({actions:s.actions,results:s.results,observed_changes:s.changes},null,2);}d.dialogue.filter(r=>['feedback_received','agent_reply','agent_question'].includes(r.type)).forEach(r=>{const p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.style.lineHeight='1.8';p.textContent=(r.type==='feedback_received'?'用户：':'Agent：')+r.text;$('conversation').append(p);});show(0);});
</script></body></html>
