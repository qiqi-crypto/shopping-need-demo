<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>购物助手 · 生活选物</title><link rel="stylesheet" href="agent.css?v=20261123-agent-status1"><link rel="stylesheet" href="participant.css?v=20261109-study3"></head><body>
<header><a class="brand">生活选物 <span>购物助手</span></a></header>
<main><section class="browser-pane"><div class="pane-title"><div><b>它正在替你逛</b><p id="status">说说你想买什么，随时可以补充或改主意。</p></div><span id="step">未开始</span></div><div class="screen"><section id="tool-view" class="tool-view" hidden><h2 id="tool-view-title"></h2><div id="tool-products"></div></section><img id="live-screen" alt="Agent 当前浏览器的真实画面" hidden><div id="screen-empty"><span>🛍</span><h1>你说需求，它来找</h1><p>搜索商品、查看详情、挑选加购<br>找到的商品会在这里显示</p></div></div><div class="browser-controls"><button id="stop" disabled hidden>结束这次</button><button id="export" disabled hidden>下载本次记录</button><button id="finish-shopping" disabled>结束挑选 · 去购物车</button></div><p class="pointer-note" hidden>实时浏览画面</p></section>
<aside class="conversation"><div class="chat-title"><h2>和购物助手聊聊</h2><span>可以边看边补充</span></div><section class="live-cart" aria-label="实时购物车"><div class="live-cart-heading"><b>购物车 <span id="live-cart-count">0</span></b><button id="preview-cart" disabled>去购物车选一件</button></div><div id="live-cart-items"><p class="cart-empty">助手挑好的商品会出现在这里</p></div><span id="live-cart-update" class="sr-only" role="status"></span></section><section id="setup"><label>这次逛哪个场景<select id="scene"><option value="pets">宠物生活</option><option value="baby">母婴用品</option><option value="moving">搬家家居</option><option value="sports">运动户外</option></select></label><label>体验访问码<input id="invite" type="password" placeholder="输入邀请人提供的访问码" autocomplete="off"></label><p>开始后，对话和浏览操作将保存到实验服务器。先把候选加入购物车，最后由你选出最想要的一件。</p></section><div id="messages" class="messages" aria-live="polite"><div class="message assistant">请核对下面的购物需求，点击“开始帮我找”。之后也可以随时补充。</div></div><div id="agent-activity" class="agent-activity" role="status" aria-live="polite" hidden><span class="activity-dot" aria-hidden="true"></span><span id="agent-activity-text"></span></div><div id="feedback-status" role="status"></div><div id="agent-return" hidden></div><form id="chat-form"><textarea id="message" rows="3" maxlength="3000" placeholder="例如：给家里的猫找个吃饭的碗，想要容易清洗的，人民币参考价 150 元以内。" required></textarea><div><small>不合适就告诉它，随时调整。</small><button id="send" type="submit">开始帮我找</button></div></form><p class="footnote">商品价格统一为人民币参考价。</p></aside></main><dialog id="agent-cart"><div class="pane-title"><b>购物车 · 选出最想要的一件</b><button id="close-cart">继续挑选</button></div><div id="agent-cart-items"></div><p id="cart-notice">从购物车选出最想要的一件，确认后完成本轮。</p><button id="final-none">没有合适的，这次不选</button><p id="cart-error" role="status"></p></dialog>
<dialog id="cart-product-detail" aria-labelledby="cart-product-heading"><div class="cart-detail-heading"><b id="cart-product-heading">商品详情</b><button id="close-cart-product">返回购物车</button></div><div id="cart-product-body"></div><div class="cart-detail-footer"><p id="cart-product-status" role="status"></p><button id="choose-cart-product" disabled>最终选这件</button></div></dialog>
<dialog id="agent-choice"><h2>确认这次选择</h2><p id="agent-choice-title"></p><p id="agent-choice-prompt"></p><div><button id="cancel-final">返回购物车</button><button id="confirm-final">确定最终选择</button></div><p id="final-error" role="status"></p></dialog>
<script src="agent-config.js?v=20261109-study3"></script><script src="participant.js?v=flow4"></script><script src="study.js?v=flow4"></script><script src="round-flow.js?v=20261116-receipt1"></script><script src="event-clock.js?v=20261116-dataset1"></script><script src="event-journal.js?v=20261116-dataset1"></script><script src="product-reviews.js?v=20261116-reviewcoverage1"></script><script src="agent-cart-details.js?v=20261116-dataset1"></script><script src="agent.js?v=20261123-agent-status1"></script></body></html>
