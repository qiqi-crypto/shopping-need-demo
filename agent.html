<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>购物助手 · 生活选物</title><link rel="stylesheet" href="agent.css?v=20261109-records2"><link rel="stylesheet" href="participant.css?v=20261109-records2"></head><body>
<header><a href="catalog.html" class="brand">生活选物 <span>购物助手</span></a><nav><a href="agent-demo.html" style="margin-right:20px">看一轮真实试跑</a><a href="catalog.html">← 自己逛逛</a></nav></header>
<main><section class="browser-pane"><div class="pane-title"><div><b>它正在替你逛</b><p id="status">说说你想买什么，随时可以补充或改主意。</p></div><span id="step">未开始</span></div><div class="screen"><img id="live-screen" alt="Agent 当前浏览器的真实画面" hidden><div id="screen-empty"><span>🛍</span><h1>你说需求，它来找</h1><p>搜索、打开商品、返回比较<br>每一步都能在这里看到</p></div></div><div class="browser-controls"><button id="pause" disabled>暂停</button><button id="resume" disabled>继续</button><button id="stop" disabled>结束这次</button><button id="export" disabled>下载本次记录</button></div><details class="trace"><summary>看看它刚才做了什么 <span id="trace-count"></span></summary><ol id="timeline"></ol></details></section>
<aside class="conversation"><div class="chat-title"><h2>和购物助手聊聊</h2><span>可以边看边补充</span></div><section id="setup"><label>这次逛哪个场景<select id="scene"><option value="pets">宠物生活</option><option value="baby">母婴用品</option><option value="moving">搬家家居</option><option value="sports">运动户外</option></select></label><label>体验访问码<input id="invite" type="password" placeholder="输入邀请人提供的访问码" autocomplete="off"></label><p>开始后，对话和浏览操作将保存到实验服务器。不涉及下单或付款。</p></section><div id="messages" class="messages" aria-live="polite"><div class="message assistant">你打算给谁买、用在什么地方？有预算或不想要的，也一起告诉我。</div></div><div id="feedback-status" role="status"></div><form id="chat-form"><textarea id="message" rows="3" maxlength="3000" placeholder="例如：给家里的猫找个吃饭的碗，想要容易清洗的，人民币参考价 150 元以内。" required></textarea><div><small>不合适就告诉它，随时调整。</small><button id="send" type="submit">开始帮我找</button></div></form><p class="footnote">画面来自服务器上的 Agent 浏览器。商品价格为历史美元标价与人民币换算参考；建议不代表购买。</p></aside></main>
<script src="agent-config.js?v=20261109-records2"></script><script src="participant.js?v=20261109-records2"></script><script src="agent.js?v=20261109-records2"></script></body></html>
