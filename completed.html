<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>领取参与码 · 生活选物</title>
<link rel="stylesheet" href="catalog.css"><link rel="stylesheet" href="participant.css">
<style>
.participant-bar{display:none}.completion-card{max-width:680px;margin:10vh auto;background:white;border-radius:20px;padding:40px;box-sizing:border-box}.completion-card h1{font-size:28px;line-height:1.5}.completion-kicker{color:#b44810;font-size:14px;font-weight:700}.completion-actions{margin-top:24px}.completion-card button{background:#d94c09;color:white;border:0;border-radius:10px;padding:15px 24px;font-size:18px;font-weight:700;cursor:pointer}.completion-card button:focus-visible,.completion-card input:focus-visible{outline:3px solid #7d310e;outline-offset:3px}#completion-status{line-height:1.8;color:#535353}#completion-receipt{background:#fff6ee;border:1px solid #f2d5bd;border-radius:14px;padding:24px;margin-top:28px}#completion-receipt label{display:block;font-size:16px;font-weight:700;margin-bottom:12px}#completion-code{display:block;width:100%;box-sizing:border-box;padding:15px 10px;background:white;border:1px solid #dcbda6;border-radius:8px;font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center;letter-spacing:.6px;color:#262626}#completion-copy{width:100%;margin-top:16px}#copy-status{margin:14px 0 0;line-height:1.6;color:#78431c}.completion-note{font-size:14px;color:#666;line-height:1.7;margin:20px 0 0}@media(max-width:700px){.completion-card{margin:6vh 16px;padding:24px}.completion-card h1{font-size:24px}#completion-receipt{padding:18px 14px}#completion-code{font-size:clamp(12px,3.8vw,20px);letter-spacing:0}}
</style></head>
<body><main class="completion-card"><p class="completion-kicker">购物体验 · 最后一步</p><h1 id="completion-title">正在确认体验进度…</h1><p id="completion-status" role="status"></p>
<section id="completion-receipt" hidden><label for="completion-code">你的专属参与码</label><input id="completion-code" readonly spellcheck="false" autocomplete="off" aria-label="参与码"><button id="completion-copy" type="button">复制参与码</button><p id="copy-status" role="status" aria-live="polite"></p><p class="completion-note">返回原来的 Credamo 问卷页面，将参与码填入指定位置并提交。</p></section>
<div class="completion-actions"><button id="completion-next" hidden>继续</button></div></main>
<script src="agent-config.js"></script><script src="participant.js?v=flow4"></script><script src="completed.js?v=20261123-restart1"></script></body></html>
