<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开始这次购物</title><link rel="stylesheet" href="agent.css"><link rel="stylesheet" href="participant.css"><style>main{display:block;max-width:620px;margin:55px auto}.entry{background:#fff;padding:32px;border-radius:18px}li{margin:18px 0;line-height:1.8}#start{width:100%;background:#e85b1a;color:#fff}.participant-bar{display:none}</style></head><body><main><section class="entry"><span>生活选物 · 购物说明</span><h1>挑一件你真的想要的</h1><ol><li><b>先慢慢看，把想买的加入购物车。</b><br>可以放多件，也可以随时移除。</li><li><b>结束时，从购物车选出最想要的一件。</b><br>没有合适的也可以不选，不用为了完成任务凑一件。</li><li><b>请按真实购买来挑选。</b><br>请想象最终选中的商品会由你实际使用，按自己真正想买的来选择。本次是模拟购物，不需要付款，也不发放实物。</li></ol><p>系统会随机安排你自己挑选，或由购物助手代挑。助手代挑时，你可以随时提问、补充要求或说“不喜欢”。</p><label id="entry-code-label">体验访问码<input id="entry-code" type="password" autocomplete="off"></label><button id="start">已了解，进入本次购物</button><p id="entry-status" role="status"></p><button id="restore-entry" style="border:0;background:none;color:#777">已有个人记录码？恢复参与记录</button></section></main><script src="agent-config.js"></script><script src="participant.js"></script><script>
document.getElementById('restore-entry').onclick=()=>document.getElementById('identity-connect').click();
const go=document.getElementById('start'),status=document.getElementById('entry-status');
function updateIdentityEntry(){const connected=!!window.rsIdentity.get();document.getElementById('entry-code-label').hidden=connected;document.getElementById('restore-entry').hidden=connected;}
updateIdentityEntry();window.addEventListener('rs-identity-changed',updateIdentityEntry);
let ctx=null;try{ctx=JSON.parse(sessionStorage.getItem('rs_need_handoff_v1'));}catch{}
if(!ctx?.confirmedNeed){go.textContent='先填写我的购买需求';go.onclick=()=>location.href='index.html';}
else go.onclick=async()=>{go.disabled=true;try{await window.rsIdentity.ensure(document.getElementById('entry-code').value.trim());const a=await window.rsIdentity.request('/api/participant/study',{context:ctx});sessionStorage.setItem('rs_study_entry',JSON.stringify(a));const scene=new URLSearchParams(location.search).get('scene')||'baby';location.replace((a.arm==='agent_browser'?'agent.html':'catalog.html')+'?scene='+encodeURIComponent(scene));}catch(e){status.textContent=e.message;go.disabled=false;}};
</script></body></html>
