<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开始这次购物</title><link rel="stylesheet" href="agent.css"><link rel="stylesheet" href="participant.css"><style>main{display:block;max-width:620px;margin:55px auto}.entry{background:#fff;padding:32px;border-radius:18px}li{margin:18px 0;line-height:1.8}#start{width:100%;background:#e85b1a;color:#fff}.participant-bar{display:none}</style></head><body><main><section class="entry"><span>生活选物 · 购物说明</span><h1>挑一件你真的想要的</h1><ol><li><b>先慢慢看，把想买的加入购物车。</b><br>可以放多件，也可以随时移除。</li><li><b>结束时，从购物车选出最想要的一件。</b><br>没有合适的也可以不选，不用为了完成任务凑一件。</li><li><b>请按真实购买来挑选。</b><br>请想象最终选中的商品会由你实际使用，按自己真正想买的来选择。本次为模拟购物体验。</li></ol><p>你将完成两轮购物：一轮自己挑选，一轮由购物助手代挑，先后顺序由系统随机安排。两轮都围绕这次需求。助手代挑时，你可以随时提问、补充要求或说“不喜欢”。</p><label id="entry-code-label">体验访问码<input id="entry-code" type="password" autocomplete="off"></label><button id="start">已了解，进入本次购物</button><p id="entry-status" role="status"></p><button id="restore-entry" style="border:0;background:none;color:#777">已有个人记录码？恢复参与记录</button></section></main><script src="study-config.js?v=20261115"></script><script src="agent-config.js?v=20261126-link1"></script><script src="participant.js?v=flow4"></script><script src="purchase-history.js?v=20261115-flow4"></script><script src="agent-config.js?v=20261126-link1"></script><script src="event-clock.js?v=20261116-dataset1"></script><script src="event-journal.js?v=20261116-dataset1"></script><script src="visit-telemetry.js?v=20261116-dataset1"></script><script src="study-entry.js?v=20261123-need-prefill1"></script></body></html>
