<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>购物搜索体验 · 开发预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f2;color:#252321;font:16px system-ui}header{background:white;border-bottom:1px solid #eee;padding:18px max(5vw,20px);font-weight:700}main{max-width:1100px;margin:35px auto;padding:0 20px}h1{font-size:30px}.note{background:#fff4e5;color:#734b15;border-radius:12px;padding:13px}.choices{display:flex;gap:10px;flex-wrap:wrap}button,input{font:inherit;border:1px solid #ddd;background:white;border-radius:9px;padding:11px 16px}button{cursor:pointer}button.active{border-color:#e65a22;background:#fff2eb;color:#bd4315}.row{margin:25px 0}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.item{background:white;border:1px solid #eee;border-radius:12px;overflow:hidden}.item img{width:100%;height:175px;object-fit:contain;background:white}.item div{padding:12px}.price{color:#d7541c;font-size:19px;font-weight:bold}button:disabled{opacity:.5;cursor:not-allowed}</style></head><body><header>购物搜索体验</header><main><p class="note">开发预览：当前只用于查看场景与真实商品，AI 推荐和正式问卷尚未接通。</p><h1>你想找什么？</h1><div class="row"><strong>1. 选择场景</strong><div class="choices" id="scenes"></div></div><div class="row"><strong>2. 选择商品</strong><div class="choices" id="categories"></div></div><div class="row"><label for="query">3. 你有什么要求？</label><p><input id="query" placeholder="例如：轻便、防水" maxlength="100"> <button id="search">自己查找</button> <button disabled title="AI 接口正在接入">让 AI 帮我找（尚未接通）</button></p></div><p id="status">请选择商品类别。</p><div id="grid"></div></main><script src="app.js"></script></body></html>
