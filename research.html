<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RS_Agent · 研究数据</title><link rel="stylesheet" href="research.css?v=20261116-dataset1"></head><body>
<header><div><span>生活选物 / RS_Agent</span><h1>实验数据</h1></div><a href="index.html">参与者入口 ↗</a></header>
<main><form id="login"><h2>研究后台</h2><label>研究后台访问码<input id="admin-key" type="password" autocomplete="off" required></label><button>连接数据</button><p>仅研究者可查看。访问码与参与者体验码不同。</p></form>
<section id="workspace" hidden><div class="toolbar"><label>用户 ID<input id="user-filter" placeholder="留空查看全部用户"></label><label class="check"><input id="include-tests" type="checkbox">包含工程测试</label><button id="refresh">刷新</button><button id="export">下载完整数据集 ZIP</button><button id="logout">退出</button></div>
<div id="summary" class="stats"></div><p id="user-time" hidden></p><p class="note">每 5 秒刷新。时间统一显示 UTC；在线时长按实际收到的页面记录计算。真人标记表示实验分配的参与者操作，Agent 标记来自服务器受控运行。</p>
<div class="table-wrap"><table><thead><tr><th>用户 / 轮次</th><th>操作来源</th><th>记录数</th><th>考虑商品</th><th>页面时间</th><th>前台 / 近期操作</th><th>最后收到记录（UTC）</th><th></th></tr></thead><tbody id="sessions"></tbody></table></div><button id="older" hidden>加载更早记录</button>
<section id="inspection" hidden><div class="section-title"><h2 id="inspection-title">记录详情</h2><button id="close-inspection">收起</button></div><p id="inspection-summary"></p><div id="sets"></div><details><summary>模型字段与完整性检查</summary><pre id="model-data"></pre></details><h3>逐事件轨迹</h3><p class="note">“间隔”是相邻客户端事件时间差；网络到达时间另存。心跳、鼠标采样和业务操作各自保留。</p><div class="table-wrap"><table><thead><tr><th>序号</th><th>客户端时间（UTC）</th><th>动作</th><th>商品 / 内容</th><th>间隔</th><th>原始记录</th></tr></thead><tbody id="events"></tbody></table></div><button id="more-events" hidden>加载更多事件</button></section>
</section><p id="status" role="status"></p></main><script src="agent-config.js?v=20261116-dataset1"></script><script src="research.js?v=20261116-dataset1"></script></body></html>
